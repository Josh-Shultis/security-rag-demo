[project]
name = "security-rag-demo"
version = "0.1.0"
description = "Offline synthetic investigation using Security RAG source-linked retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Josh Shultis"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
security-rag-investigate = "security_rag.investigation:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_rag = ["fixtures/SYNTH-001/*.json"]
